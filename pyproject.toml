[project]
name = "idx-stock-workers"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "curl-cffi>=0.16.1",
    "lxml>=5.0",
    "psycopg[binary]>=3.3.4",
    "python-dotenv>=1.2.2",
]

[dependency-groups]
dev = [
    "pytest>=8.4.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
